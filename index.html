<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--surf:#111318;--surf2:#1a1d24;--brd:#2a2d38;--acc:#f5a623;--acc2:#00e5ff;--txt:#e8eaf0;--muted:#6b7280;--green:#22c55e;--red:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:'Syne',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(245,166,35,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,166,35,.03) 1px,transparent 1px);background-size:40px 40px;}

/* LAYOUT */
.shell{display:grid;grid-template-columns:170px 60px 1fr 170px;min-height:100vh;max-width:1300px;margin:0 auto;position:relative;z-index:1;}
.sidebar{padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:14px;position:sticky;top:0;height:100vh;}
.center{display:flex;flex-direction:column;align-items:center;padding-bottom:40px;}

/* ADS */
.ad{background:var(--surf);border:1px dashed var(--brd);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.55rem;font-family:'Space Mono',monospace;letter-spacing:.05em;text-transform:uppercase;gap:5px;flex-shrink:0;}
.ad svg{opacity:.2;}
.ad-160{width:160px;height:600px;}
.ad-728{width:100%;max-width:728px;height:90px;}
.banner{width:100%;display:flex;justify-content:center;padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--brd);}
.banner-bot{width:100%;display:flex;justify-content:center;padding:14px 16px;background:var(--surf);border-top:1px solid var(--brd);margin-top:20px;}

/* APP */
.app{width:100%;max-width:440px;margin:20px auto 0;background:var(--surf);border:1px solid var(--brd);border-radius:20px;overflow:hidden;box-shadow:0 0 60px rgba(245,166,35,.07);min-height:560px;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surf2);border-bottom:1px solid var(--brd);}
.tbtn{width:36px;height:36px;background:none;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:all .2s;}
.tbtn:hover{background:var(--brd);color:var(--txt);}
.tbtn.hide{visibility:hidden;pointer-events:none;}
.tabs{display:flex;gap:4px;}
.tab{padding:7px 20px;background:transparent;border:1px solid var(--brd);border-radius:8px;color:var(--muted);font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .2s;}
.tab.on{background:var(--acc);border-color:var(--acc);color:#000;}

/* SCREENS */
.scr{display:none;flex-direction:column;flex:1;}
.scr.on{display:flex;}

/* ── HOME ── */
.rlist{flex:1;overflow-y:auto;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 20px;color:var(--muted);font-size:.82rem;text-align:center;font-family:'Space Mono',monospace;}
.empty svg{opacity:.25;}

.rrow{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--brd);gap:12px;position:relative;transition:background .15s;cursor:default;}
.rrow:hover{background:var(--surf2);}
.rrow.base{background:rgba(245,166,35,.07);}
.ricon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;font-weight:700;overflow:hidden;}
.rleft{display:flex;align-items:center;gap:10px;min-width:90px;flex-shrink:0;}
.rsym{font-family:'Space Mono',monospace;font-size:.86rem;font-weight:700;}
.rname{font-size:.57rem;color:var(--muted);}
.rwrap{flex:1;display:flex;flex-direction:column;align-items:flex-end;}
.rinput{background:transparent;border:none;outline:none;font-family:'Space Mono',monospace;font-size:1.2rem;font-weight:700;color:var(--acc2);text-align:right;width:100%;padding:2px 0;border-bottom:1px solid transparent;transition:border-color .2s,color .2s;}
.rinput:focus{border-bottom-color:var(--acc);color:var(--txt);}
.rrow.base .rinput{color:var(--acc);}
.rrate{font-size:.56rem;color:var(--muted);font-family:'Space Mono',monospace;text-align:right;margin-top:2px;min-height:12px;}
.rdel{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.65rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;}
.rrow:hover .rdel{opacity:1;}
.rdel:hover{background:rgba(239,68,68,.2);color:var(--red);}

.addbtnwrap{padding:14px 18px;border-top:1px solid var(--brd);}
.addbtn{width:100%;padding:13px;background:var(--acc);border:none;border-radius:14px;font-family:'Syne',sans-serif;font-size:.9rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#000;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.addbtn:hover{background:#ffc145;transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,166,35,.3);}
.livebar{padding:7px 18px;display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:.53rem;color:var(--muted);border-top:1px solid var(--brd);}
.ldot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── SELECT ── */
.ssearch{padding:12px 18px;border-bottom:1px solid var(--brd);position:relative;}
.sinput{width:100%;background:var(--surf2);border:1px solid var(--brd);border-radius:14px;padding:10px 36px 10px 40px;font-family:'Space Mono',monospace;font-size:.82rem;color:var(--txt);outline:none;transition:border-color .2s;}
.sinput:focus{border-color:var(--acc);}
.sinput::placeholder{color:var(--muted);}
.sicon{position:absolute;left:30px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.sclear{position:absolute;right:26px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;display:none;padding:2px 6px;}
.sclear.vis{display:block;}
.sheader{padding:8px 18px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#fff;background:var(--surf2);border-bottom:1px solid var(--brd);}
.slist{flex:1;overflow-y:auto;}
.crow{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--brd);gap:12px;cursor:pointer;transition:background .15s;}
.crow:hover{background:var(--surf2);}
.crow.hid{display:none;}
.cicon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;font-weight:700;}
.cinfo{flex:1;min-width:0;}
.csym{font-family:'Space Mono',monospace;font-size:.86rem;font-weight:700;}
.cname{font-size:.6rem;color:var(--muted);}
.crate{font-size:.58rem;color:var(--muted);font-family:'Space Mono',monospace;}
.cact{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;pointer-events:none;}
.cadd{background:rgba(245,166,35,.15);color:var(--acc);}
.crem{background:rgba(34,197,94,.18);color:var(--green);}
.nores{display:none;text-align:center;padding:20px;color:var(--muted);font-size:.72rem;font-family:'Space Mono',monospace;}

.statusbar{font-family:'Space Mono',monospace;font-size:.56rem;color:var(--muted);text-align:center;padding:8px 0 0;width:100%;max-width:440px;}
.bnr-affiliate{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(135deg,#1a1d24,#111318);
  border:1px solid #F3BA2F44;border-radius:12px;
  padding:10px 14px;margin:0 18px 14px;cursor:pointer;
  text-decoration:none;transition:all .2s;}
.bnr-affiliate:hover{border-color:#F3BA2F;box-shadow:0 4px 20px rgba(243,186,47,.15);}
.bnr-left{display:flex;align-items:center;gap:8px;}
.bnr-logo{width:28px;height:28px;background:#F3BA2F;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;color:#000;flex-shrink:0;}
.bnr-text{font-size:.68rem;font-weight:700;color:var(--txt);}
.bnr-sub{font-size:.55rem;color:#F3BA2F;font-family:'Space Mono',monospace;}
.bnr-btn{background:#F3BA2F;color:#000;border:none;border-radius:8px;padding:6px 12px;font-family:'Syne',sans-serif;font-weight:800;font-size:.65rem;white-space:nowrap;cursor:pointer;}

/* SHARE PANEL */
.share-panel{display:flex;flex-direction:column;align-items:center;gap:8px;width:160px;}
.share-title{font-size:.5rem;font-family:'Space Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.share-btn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;text-decoration:none;flex-shrink:0;}
.share-btn:hover{transform:scale(1.15);box-shadow:0 4px 14px rgba(0,0,0,.3);}
.share-btn svg{width:18px;height:18px;fill:white;}
.sh-wa{background:#25D366;}
.sh-tg{background:#229ED9;}
.sh-tw{background:#000;}
.sh-fb{background:#1877F2;}
.sh-li{background:#0A66C2;}
.sh-rd{background:#FF4500;}
.sh-email{background:#6b7280;}
.sh-copy{background:var(--surface2);border:1px solid var(--border);}
.sh-copy svg{fill:var(--muted);}
.copy-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;font-family:'Space Mono',monospace;font-size:.7rem;font-weight:700;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.copy-toast.show{opacity:1;}

.share-col{display:flex;flex-direction:column;align-items:center;padding:110px 0 16px;position:sticky;top:16px;height:fit-content;}
@media(max-width:860px){.shell{grid-template-columns:1fr;}.sidebar{display:none;}.share-col{display:none;}}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--surf);}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px;}
</style>
</head>

/* ==============================================
   STATE
   list[]   = [{s, t}]   t='f' fiat | t='c' crypto
   baseIdx  = which row is being edited
   baseAmt  = the number in that row
   fR{}     = fiat rates  (1 USD = X fiat)
   cP{}     = crypto prices (1 crypto = X USD)
============================================== */
let list    = [];
let baseIdx = 0;
let baseAmt = 1;
let fR = {};
let cP = {};
let curTab = 'fiat';
let lastUpd = null;

/* ==============================================
   CONVERSION
   Everything via USD.
   toUSD(s,t) = how many USD is 1 unit of s
============================================== */
function toUSD(s, t) {
  if (t === 'c') return cP[s] > 0 ? cP[s] : null;
  return fR[s] > 0 ? 1 / fR[s] : null;
}

function calc(fromS, fromT, toS, toT, amount) {
  const a = toUSD(fromS, fromT);
  const b = toUSD(toS, toT);
  if (!a || !b) return null;
  return (amount * a) / b;
}


/* ==============================================
   FORMAT — NEVER scientific notation
============================================== */
function fmt(n) {
  if (n === null || n === undefined || isNaN(n) || !isFinite(n)) return '0';
  if (n === 0) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e9)   return (n / 1e9).toFixed(4) + 'B';
  if (abs >= 1e6)   return (n / 1e6).toFixed(4) + 'M';
  if (abs >= 1000)  return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:4});
  if (abs >= 1)     return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:4});
  if (abs >= 0.01)  return n.toFixed(6);
  if (abs >= 0.0001)return n.toFixed(8);
  let str = n.toFixed(18);
  str = str.replace(/0+$/, '').replace(/\.$/, '');
  return str;
}

function fmtRate(n) {
  if (n === null || n === undefined || isNaN(n) || !isFinite(n)) return '0';
  if (n === 0) return '0';
  const abs = Math.abs(n);
  if (abs >= 1000) return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:4});
  if (abs >= 1)    return n.toLocaleString('en-US', {minimumFractionDigits:4, maximumFractionDigits:4});
  if (abs >= 0.001)return n.toFixed(7);
  let str = n.toFixed(18);
  str = str.replace(/0+$/, '').replace(/\.$/, '');
  return str;
}

/* ==============================================
   DRAW HOME LIST
============================================== */
function drawHome() {
  const el = document.getElementById('rlist');

  if (list.length === 0) {
    el.innerHTML = `<div class="empty">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg>
      <div>List is empty.<br>Use <b>$</b> or <b>₿</b> to add currencies.</div>
    </div>`;
    return;
  }

  // Guard baseIdx
  if (baseIdx < 0 || baseIdx >= list.length) baseIdx = 0;
  if (baseAmt <= 0 || isNaN(baseAmt)) baseAmt = 1;

  const base = list[baseIdx];
  let html = '';

  list.forEach(function(item, i) {
    const isBase = (i === baseIdx);
    const mc = CRYPTOS.find(function(c){ return c.s === item.s; });
    const mf = FIATS.find(function(f){ return f.s === item.s; });

    let icon;
    if (item.t === 'c' && mc) {
      // Use CoinGecko token image
      icon = '<div class="ricon" style="background:'+mc.bg+';color:'+mc.co+';font-size:1rem;font-weight:700;">'+mc.ic+'</div>';
    } else {
      // Fiat: show flag emoji large
      icon = '<div class="ricon" style="background:#ffffff0d;font-size:1.35rem;line-height:1;">'+(mf ? mf.f : '💱')+'</div>';
    }

    const name = item.t === 'c' ? (mc ? mc.n : item.s) : (mf ? mf.n : item.s);

    let valStr, rateStr;
    if (isBase) {
      valStr  = fmt(baseAmt);
      rateStr = 'Base — type an amount';
    } else {
      const result = calc(base.s, base.t, item.s, item.t, baseAmt);
      valStr  = result !== null ? fmt(result) : '—';
      const r1 = calc(base.s, base.t, item.s, item.t, 1);
      rateStr = r1 !== null ? '1 '+base.s+' = '+fmtRate(r1)+' '+item.s : 'Rate unavailable';
    }

    html += '<div class="rrow'+(isBase?' base':'')+'">'
      + '<div class="rleft">'+icon+'<div><div class="rsym">'+item.s+'</div><div class="rname">'+name+'</div></div></div>'
      + '<div class="rwrap">'
      +   '<input class="rinput" type="text" inputmode="decimal" data-i="'+i+'" value="'+valStr+'" placeholder="0" oninput="onInput(this)" onfocus="onFocus(this)">'
      +   '<div class="rrate" id="rate'+i+'">'+rateStr+'</div>'
      + '</div>'
      + '<button class="rdel" onclick="delItem('+i+')">✕</button>'
      + '</div>';
  });

  el.innerHTML = html;
}

/* ==============================================
   INPUT EVENTS
============================================== */
function onFocus(inp) {
  const i = parseInt(inp.dataset.i);
  if (i === baseIdx) return;
  // Switch base: convert current amount into new base's units
  const old = list[baseIdx];
  const nw  = list[i];
  const converted = calc(old.s, old.t, nw.s, nw.t, baseAmt);
  baseIdx = i;
  if (converted !== null) baseAmt = converted;
  drawHome();
  // Re-focus after redraw
  setTimeout(function() {
    const inp2 = document.querySelector('.rinput[data-i="'+i+'"]');
    if (inp2) { inp2.focus(); inp2.select(); }
  }, 0);
}

function onInput(inp) {
  const i = parseInt(inp.dataset.i);
  baseIdx = i;
  const parsed = parseFloat(inp.value.replace(',','.'));
  baseAmt = isNaN(parsed) ? 0 : parsed;

  const base = list[baseIdx];

  // Update all OTHER rows directly in the DOM (no redraw = no focus loss)
  document.querySelectorAll('.rinput').forEach(function(el) {
    const j = parseInt(el.dataset.i);
    if (j === i) return;
    const item = list[j];
    if (!item) return;
    const result = calc(base.s, base.t, item.s, item.t, baseAmt);
    el.value = result !== null ? fmt(result) : '—';
    // Update rate label
    const rateEl = document.getElementById('rate'+j);
    if (rateEl) {
      const r1 = calc(base.s, base.t, item.s, item.t, 1);
      rateEl.textContent = r1 !== null ? '1 '+base.s+' = '+fmtRate(r1)+' '+item.s : 'Rate unavailable';
    }
  });

  // Update base highlight
  document.querySelectorAll('.rrow').forEach(function(row, j) {
    row.classList.toggle('base', j === baseIdx);
    const rinp = row.querySelector('.rinput');
    if (rinp) rinp.style.color = j === baseIdx ? 'var(--acc)' : 'var(--acc2)';
  });
}

function delItem(i) {
  list.splice(i, 1);
  baseIdx = 0;
  baseAmt = 1;
  drawHome();
}

   SELECT SCREEN
============================================== */
function drawSelectList(q) {
  const el    = document.getElementById('slist');
  const noRes = document.getElementById('nores');
  const sq    = (q || '').toLowerCase();
  let html = '';
  let vis  = 0;

  if (curTab === 'fiat') {
    html += '<div class="sheader">FIAT CURRENCIES</div>';
    FIATS.forEach(function(item, i) {
      const m = !sq || item.s.toLowerCase().includes(sq) || item.n.toLowerCase().includes(sq);
      if (m) vis++;
      const added = list.some(function(x){ return x.s === item.s && x.t === 'f'; });
      const rate  = fR[item.s] ? '1 USD = '+fR[item.s].toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4})+' '+item.s : '';
      html += makeRow(item.s, item.n, rate,
        '<div class="cicon" style="background:#ffffff12;font-size:1.1rem">'+item.f+'</div>',
        'f', added, !m);
    });
  } else {
    html += '<div class="sheader">CRYPTOCURRENCIES</div>';
    CRYPTOS.forEach(function(item, i) {
      const m = !sq || item.s.toLowerCase().includes(sq) || item.n.toLowerCase().includes(sq);
      if (m) vis++;
      const added = list.some(function(x){ return x.s === item.s && x.t === 'c'; });
      const p    = cP[item.s];
      const rate = p ? '1 '+item.s+' = $'+fmt(p)+' USD' : '';
      html += makeRow(item.s, item.n, rate,
        '<div class="cicon" style="background:'+item.bg+';color:'+item.co+'">'+item.ic+'</div>',
        'c', added, !m);
    });
  }

  el.innerHTML = html;
  noRes.style.display = vis === 0 ? 'block' : 'none';
}

function makeRow(sym, name, rate, iconEl, type, added, hidden) {
  const actCls  = added ? 'cact crem' : 'cact cadd';
  const actIcon = added
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>';
  return '<div class="crow'+(hidden?' hid':'')+'" onclick="toggle(\''+sym+'\',\''+type+'\')">'+
    iconEl+
    '<div class="cinfo"><div class="csym">'+sym+'</div><div class="cname">'+name+'</div><div class="crate">'+rate+'</div></div>'+
    '<div class="'+actCls+'">'+actIcon+'</div>'+
    '</div>';
}

function toggle(sym, type) {
  const idx = list.findIndex(function(x){ return x.s === sym && x.t === type; });
  if (idx === -1) {
    list.push({s: sym, t: type});
  } else {
    list.splice(idx, 1);
  }
  // Always reset base to row 0, amount 1 — guarantees list renders correctly always
  baseIdx = 0;
  baseAmt = 1;
  // Refresh the select list to show updated checkmarks
  drawSelectList(document.getElementById('si').value);
}

  document.getElementById('tCrypto').classList.toggle('on', t === 'crypto');

function onSearch(val) {
  document.getElementById('sc').classList.toggle('vis', val.length > 0);

function clearSearch() {
  document.getElementById('si').value = '';

}

async function loadCrypto() {
  try {
    // Binance public API — real-time prices, same as Binance exchange
    const symbols = CRYPTOS.map(function(c){ return '"'+c.s+'USDT"'; }).join(',');
    const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbols=['+symbols+']');
    if (!r.ok) throw 0;
    const d = await r.json();
    d.forEach(function(item) {
      const sym = item.symbol.replace('USDT','');
      const price = parseFloat(item.price);
      if (price > 0) cP[sym] = price;
    });
    // USDT and USDC are always 1:1 USD
    cP['USDT'] = 1;
    cP['USDC'] = 1;
    lastUpd = new Date();
  } catch {
    cP = {BTC:95000,ETH:3200,SOL:185,BNB:610,TRX:0.12,USDT:1,
      USDC:1,XRP:2.3,DOGE:0.18,ADA:0.45,DOT:7.2,AVAX:35,LINK:18,
      MATIC:0.55,LTC:85,BCH:480,ATOM:9,NEAR:7,UNI:10,XLM:0.12};
  }
}

function updateShareLinks() {
  const url  = encodeURIComponent(window.location.href);
  const text = encodeURIComponent('Check out CriptoConvert — real-time currency & crypto converter!');

  const links = {
    'sh-wa':    'https://wa.me/?text='+text+'%20'+url,
    'sh-tg':    'https://t.me/share/url?url='+url+'&text='+text,
    'sh-tw':    'https://twitter.com/intent/tweet?text='+text+'&url='+url,
    'sh-fb':    'https://www.facebook.com/sharer/sharer.php?u='+url,
    'sh-li':    'https://www.linkedin.com/sharing/share-offsite/?url='+url,
    'sh-rd':    'https://reddit.com/submit?url='+url+'&title='+text,
    'sh-email': 'mailto:?subject=CriptoConvert&body='+text+'%20'+url,
  };

  Object.keys(links).forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.href = links[id];
  });
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(function() {
    const t = document.getElementById('copyToast');
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2000);
  });
}
